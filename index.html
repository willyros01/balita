<!DOCTYPE html>
<html lang="en" data-theme="day" data-contrast="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Philippine and world news, stripped of advertising and set for easy reading.">
<meta name="theme-color" content="#FFFFFF">
<title>Balita — news, plainly</title>

<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>

<body data-view="feed">

<header class="topbar">
  <div class="topbar-inner">
    <h1 class="wordmark">Balita<span>News, plainly</span></h1>
    <div class="controls">
      <button class="ctrl" id="smaller"  type="button" aria-label="Smaller text"><span class="glyph" aria-hidden="true">A&minus;</span></button>
      <button class="ctrl" id="bigger"   type="button" aria-label="Bigger text"><span class="glyph" aria-hidden="true">A+</span></button>
      <button class="ctrl" id="contrast" type="button" aria-pressed="false" aria-label="High contrast"><span class="glyph" aria-hidden="true">&#9680;</span></button>
      <button class="ctrl" id="theme"    type="button" aria-pressed="false" aria-label="Night mode"><span class="glyph" aria-hidden="true">&#9790;</span></button>
    </div>
  </div>
</header>

<nav class="sources" aria-label="Filter by source">
  <div class="sources-inner" id="chips"></div>
</nav>

<main>
  <!-- the list -->
  <div class="view view-feed">
    <div class="status-line">
      <span id="count"></span>
      <span id="updated"></span>
    </div>
    <ul class="feed" id="feed"></ul>
  </div>

  <!-- one story -->
  <article class="view view-reader" id="reader" tabindex="-1"></article>

  <!-- add and remove feeds -->
  <section class="view view-manage" id="manage" tabindex="-1"></section>
</main>

<footer class="about" id="about">
  <h2 class="about-title">About this app</h2>
  <dl class="about-list" id="about-list"></dl>
  <p class="about-note" id="about-note"></p>
</footer>

<div class="sr-only" role="status" aria-live="polite" id="announce"></div>

<script type="module" src="app.js"></script>
</body>
</html>
