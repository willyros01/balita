name: Test stale and current notifications

on:
  push:
    paths:
      - ".github/workflows/test-dual-notifications.yml"

permissions:
  contents: read
  id-token: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - id: google-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: wire-news-6da5a
          workload_identity_provider: projects/927723710869/locations/global/workloadIdentityPools/wire-github/providers/balita-main
          service_account: wire-news-sender@wire-news-6da5a.iam.gserviceaccount.com
          token_format: access_token
      - run: node notification-dual-test.mjs
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
