name: Push registration audit

on:
  push:
    paths:
      - ".github/workflows/push-audit.yml"

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: wire-news-6da5a
          workload_identity_provider: projects/927723710869/locations/global/workloadIdentityPools/wire-github/providers/balita-main
          service_account: wire-news-sender@wire-news-6da5a.iam.gserviceaccount.com
          token_format: access_token

      - name: List safe registration metadata
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          node <<'NODE'
          const url = "https://firestore.googleapis.com/v1/projects/wire-news-6da5a/databases/(default)/documents/pushSubscriptions?pageSize=300";
          const res = await fetch(url, { headers: { Authorization: "Bearer " + process.env.ACCESS_TOKEN } });
          if(!res.ok) throw new Error("Firestore HTTP " + res.status);
          const body = await res.json();
          const f = (doc, name, kind) => doc.fields?.[name]?.[kind] ?? null;
          const rows = (body.documents || []).map((doc, index) => {
            const ua = String(f(doc, "userAgent", "stringValue") || "");
            return {
              registration: index + 1,
              device: /iPad/i.test(ua) ? "iPad" : /iPhone/i.test(ua) ? "iPhone" : "Other",
              enabled: f(doc, "enabled", "booleanValue"),
              appVersion: f(doc, "appVersion", "stringValue"),
              addressRevision: f(doc, "addressRevision", "stringValue"),
              updatedAt: f(doc, "updatedAt", "timestampValue"),
              documentUpdatedAt: doc.updateTime
            };
          }).sort((a,b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
          console.log(JSON.stringify(rows, null, 2));
          NODE
