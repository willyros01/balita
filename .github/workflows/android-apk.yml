name: Wire Android signed APK

on:
  push:
    branches: [android]
    paths:
      - "android-src/**"
      - "build/prepare-android.mjs"
      - "build/test-android.mjs"
      - "build/AndroidIcons.java"
      - "build/android-sign.sh"
      - "build/android-build.sh"
      - "build/wadm.sh"
      - "build/install-wire-push.mjs"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wire-android-apk
  cancel-in-progress: true

jobs:
  check:
    name: Verify Wire reader and ADM/FCM native compilation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Check Android reader and isolated main news workflow
        run: |
          npm install --no-audit --no-fund
          node build/prepare-android.mjs
          node build/test-android.mjs
          node --test android-src/native-sender.test.mjs
          node --test android-src/foreground-alerts.test.mjs
          node --test android-src/foreground-ui.test.mjs
          node --test android-src/back.test.mjs
          node --check build/install-wire-push.mjs
          bash -n build/wadm.sh
          bash -n build/android-build.sh
          bash -n build/android-sign.sh
      - name: Compile native A3L ADM and FCM receiver
        env:
          WIRE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.WIRE_GOOGLE_SERVICES_JSON_B64 }}
          WIRE_ADM_API_KEY: ${{ secrets.WIRE_ADM_API_KEY }}
        run: |
          npx cap add android
          npx cap sync android
          bash build/wadm.sh
          test -s android/app/google-services.json
          test -s android/app/src/main/assets/api_key.txt
          grep -F 'com.amazon.A3L.messaging.intent.MESSAGE' android/app/src/main/AndroidManifest.xml
          java build/AndroidIcons.java icon-512.png android/app/src/main/res
          cd android
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac

  apk:
    name: Sign permanent Wire Android APK
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      WIRE_SIGNING_KEYSTORE_BASE64: ${{ secrets.WIRE_SIGNING_KEYSTORE_BASE64 }}
      WIRE_SIGNING_PASSWORD: ${{ secrets.WIRE_SIGNING_PASSWORD }}
      WIRE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.WIRE_GOOGLE_SERVICES_JSON_B64 }}
      WIRE_ADM_API_KEY: ${{ secrets.WIRE_ADM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the permanent Wire signing secrets
        run: |
          if [ -z "$WIRE_SIGNING_KEYSTORE_BASE64" ] || [ -z "$WIRE_SIGNING_PASSWORD" ]; then
            echo "::error title=Signing credentials needed::Set WIRE_SIGNING_KEYSTORE_BASE64 and WIRE_SIGNING_PASSWORD in Actions secrets; no transient APK may be published."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and verify permanently signed Wire APK
        run: bash build/android-build.sh
      - name: Upload signed Wire APK
        uses: actions/upload-artifact@v4
        with:
          name: wire-android-signed-reader-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  publication:
    name: Hand off signed APK to Cuberoot auto-publisher
    needs: [apk]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify this run uploaded a signed APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts"
          PASS=0
          for attempt in 1 2 3 4 5; do
            curl --fail --silent --show-error --retry 2 --retry-delay 1 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' "$URL" -o artifacts.json
            if node --input-type=commonjs - <<'JS'
          const fs=require('fs');
          const items=JSON.parse(fs.readFileSync('artifacts.json','utf8')).artifacts||[];
          const a=items.filter(x=>x.name==='wire-android-signed-reader-apk'&&!x.expired&&x.size_in_bytes>1000000);
          if(a.length!==1)process.exit(1);
          console.log('Verified signed artifact handoff:',a[0].id,'bytes:',a[0].size_in_bytes);
          JS
            then PASS=1; break; fi
            sleep 3
          done
          if [ "$PASS" != 1 ]; then
            echo '::error title=No signed APK artifact::Cuberoot must not publish this build'
            exit 1
          fi
      - name: Verify automatic Cuberoot publishing is configured
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            -H 'Cache-Control: no-cache' \
            "https://raw.githubusercontent.com/willyros01/Cuberoot/main/.github/workflows/publish-wire-apk.yml?run=${GITHUB_RUN_ID}" \
            -o publisher.yml
          grep -Fq 'name: Publish Wire Android APK' publisher.yml
          grep -Fq "cron: '*/5 * * * *'" publisher.yml
          grep -Fq 'run: bash build/publish-wire.sh' publisher.yml
          echo 'Verified automatic Cuberoot publisher: five-minute scheduled checks.'
      - name: Record automatic publishing handoff
        run: |
          echo '::notice title=Wire APK handoff complete::Cuberoot fetches the latest SUCCESSFUL signed Android build automatically. Its publisher and GitHub Pages deployment run independently after this workflow succeeds.'
          {
            echo '### Cuberoot Wire APK — publishing handoff'
            echo "Signed artifact: verified for run $GITHUB_RUN_ID"
            echo 'Cuberoot publisher: configured for automatic checks every 5 minutes (GitHub scheduling may be delayed).'
            echo "After Cuberoot publishes, verify its manifest and Pages deployment before announcing release: https://www.cuberoot-systems.com/downloads/wire.apk?build=$GITHUB_RUN_ID"
            echo 'Failed builds never replace the previous APK.'
          } >> "$GITHUB_STEP_SUMMARY"
