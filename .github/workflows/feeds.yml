name: Fetch news

on:
  schedule:
    # Twice an hour, deliberately off the half hour. Free-tier jobs
    # asking for :00 and :30 compete with everybody else's and get
    # dropped; odd minutes are far more likely to actually run.
    - cron: "7,37 * * * *"
  workflow_dispatch:      # adds a "Run workflow" button

  # An outside service can start a run by posting here. GitHub's own
  # scheduler has never fired once on this repository — free-tier cron
  # is best-effort and is dropped whenever their runners are busy.
  # See SETUP.md for wiring up a scheduler that actually keeps time.
  repository_dispatch:
    types: [fetch-news]

  push:
    paths:                # a code or feed change should take effect at once
      - "sources.json"
      - "fetch-feeds.mjs"
      - "extract.mjs"
      - "discover.mjs"
      - "net.mjs"
      - "breaking-notify.mjs"
      - "breaking-state.json"
      - ".github/workflows/feeds.yml"

# Needed so the job can commit the file it writes.
permissions:
  contents: write
  id-token: write

# A queued run stays pinned to the commit that created it. One left
# waiting for two hours eventually ran with hours-old code and undid
# newer work. Cancel what is superseded rather than holding it.
concurrency:
  group: fetch-news
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      # v5 of both actions runs on Node 24. v4 still works but warns,
      # because GitHub is retiring Node 20 from its runners.
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund

      # Exchanges GitHub's five-minute identity for a short-lived Google
      # access token. There is no stored service-account key.
      - name: Authenticate notification sender
        id: google-auth
        uses: google-github-actions/auth@v3
        continue-on-error: true
        with:
          project_id: wire-news-6da5a
          workload_identity_provider: projects/927723710869/locations/global/workloadIdentityPools/wire-github/providers/balita-main
          service_account: wire-news-sender@wire-news-6da5a.iam.gserviceaccount.com
          token_format: access_token

      - name: Fetch the news
        run: node fetch-feeds.mjs
        env:
          # The Cloudflare doorway, for hosts that refuse this server.
          # Both are optional: without them the fetcher behaves exactly
          # as it did before, and those outlets stay headline-only.
          WIRE_DOOR_URL: ${{ secrets.WIRE_DOOR_URL }}
          WIRE_KEY: ${{ secrets.WIRE_KEY }}

      - name: Send tightly limited breaking-news alerts
        run: node breaking-notify.mjs
        continue-on-error: true
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          # A release commit bearing the exact marker below sends one clearly
          # labelled Inquirer test alert. Ordinary runs always remain strict.
          WIRE_TEST_INQUIRER: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[test-inquirer-alert]') && '1' || '0' }}

      - name: Commit if anything changed
        run: |
          git config user.name  "balita-bot"
          git config user.email "balita-bot@users.noreply.github.com"

          if git diff --quiet articles.json breaking-state.json; then
            echo "Nothing new."
            exit 0
          fi

          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('articles.json','utf8')).articles.length)")
          git add articles.json breaking-state.json
          git commit -m "News: $COUNT stories"

          # Another run may have landed while this one was working.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --strategy-option=theirs || true
            sleep 5
          done

          echo "Could not push after three tries."
          exit 1
